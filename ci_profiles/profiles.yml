cms_spine:
  target: ci

  outputs:

    ci:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('NEON_DBNAME') }}"
      schema: dbt_ci
      threads: 4
      sslmode: require
      connect_timeout: 30
